name: Build iOS 15 IPA

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios15-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build TgWsProxy iOS 15
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: false

      - name: Check toolchain
        shell: bash
        run: |
          set -e
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          go version

      - name: Prepare AppIcon
        shell: bash
        run: |
          set -e
          ICON_DIR="TgWsProxy/Assets.xcassets/AppIcon.appiconset"
          SOURCE="$ICON_DIR/AppIcon.png"
          test -d "$ICON_DIR"
          test -f "$SOURCE"
          for size in 40 58 60 76 80 87 120 152 167 180 1024; do
            sips -z "$size" "$size" "$SOURCE" --out "$ICON_DIR/AppIcon-${size}.png" >/dev/null
          done
          python3 -m json.tool "$ICON_DIR/Contents.json" >/dev/null
          rm -rf "$RUNNER_TEMP/appicon-test"
          mkdir -p "$RUNNER_TEMP/appicon-test"
          rm -f "$RUNNER_TEMP/appicon-info.plist"
          xcrun actool "TgWsProxy/Assets.xcassets" --compile "$RUNNER_TEMP/appicon-test" --platform iphoneos --minimum-deployment-target 15.0 --app-icon AppIcon --output-partial-info-plist "$RUNNER_TEMP/appicon-info.plist"
          test -f "$RUNNER_TEMP/appicon-test/Assets.car"

      - name: Build Go static libraries
        shell: bash
        run: |
          set -e
          rm -rf build
          mkdir -p build/ios build/sim
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          IOS_CC=$(xcrun --sdk iphoneos -f clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="$IOS_CC" CGO_CFLAGS="-isysroot $IOS_SDK -arch arm64 -mios-version-min=15.0" CGO_LDFLAGS="-isysroot $IOS_SDK -arch arm64 -mios-version-min=15.0" go build -v -buildmode=c-archive -o build/ios/libtgwsproxy.a .
          SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          SIM_CC=$(xcrun --sdk iphonesimulator -f clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="$SIM_CC" CGO_CFLAGS="-isysroot $SIM_SDK -arch arm64 -mios-simulator-version-min=15.0" CGO_LDFLAGS="-isysroot $SIM_SDK -arch arm64 -mios-simulator-version-min=15.0" go build -v -buildmode=c-archive -o build/sim/libtgwsproxy.a .
          xcodebuild -create-xcframework -library build/ios/libtgwsproxy.a -headers include -library build/sim/libtgwsproxy.a -headers include -output build/TgWsProxy.xcframework

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild archive -project TgWsProxy.xcodeproj -scheme TgWsProxy -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/TgWsProxy.xcarchive" IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' LIBRARY_SEARCH_PATHS="$PWD/build/ios" OTHER_LDFLAGS="$PWD/build/ios/libtgwsproxy.a" | tee build/logs/xcodebuild.log

      - name: Verify archive
        shell: bash
        run: |
          set -e
          APP="build/TgWsProxy.xcarchive/Products/Applications/TgWsProxy.app"
          test -d "$APP"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          file "$APP/TgWsProxy"

      - name: Create IPA
        shell: bash
        run: |
          set -e
          rm -rf build/Payload build/TgWsProxy-ios15.ipa
          mkdir -p build/Payload
          cp -R build/TgWsProxy.xcarchive/Products/Applications/TgWsProxy.app build/Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/Payload build/TgWsProxy-ios15.ipa
          test -f build/TgWsProxy-ios15.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-iOS15
          path: |
            build/TgWsProxy-ios15.ipa
            build/TgWsProxy.xcframework
            build/logs/xcodebuild.log
          if-no-files-found: error
          retention-days: 14
