name: Build iOS 15 IPA

on:
  push:
    branches:
      - ios15
  pull_request:
    branches:
      - ios15
  workflow_dispatch:

concurrency:
  group: ios15-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Build XCFramework
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios build/sim

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          CC_PATH=$(xcrun --sdk iphoneos -f clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$CC_PATH" \
            CGO_CFLAGS="-isysroot $SDK_PATH -arch arm64 -mios-version-min=15.0" \
            CGO_LDFLAGS="-isysroot $SDK_PATH -arch arm64 -mios-version-min=15.0" \
            go build -v -buildmode=c-archive -o build/ios/libtgwsproxy.a .

          SIM_SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          SIM_CC_PATH=$(xcrun --sdk iphonesimulator -f clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$SIM_CC_PATH" \
            CGO_CFLAGS="-isysroot $SIM_SDK_PATH -arch arm64 -mios-simulator-version-min=15.0" \
            CGO_LDFLAGS="-isysroot $SIM_SDK_PATH -arch arm64 -mios-simulator-version-min=15.0" \
            go build -v -buildmode=c-archive -o build/sim/libtgwsproxy.a .

          xcodebuild -create-xcframework \
            -library build/ios/libtgwsproxy.a -headers include \
            -library build/sim/libtgwsproxy.a -headers include \
            -output build/TgWsProxy.xcframework

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild archive \
            -project TgWsProxy.xcodeproj \
            -scheme TgWsProxy \
            -configuration Release \
            -archivePath build/TgWsProxy.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            "LIBRARY_SEARCH_PATHS=$(pwd)/build/ios" \
            "OTHER_LDFLAGS=$(pwd)/build/ios/libtgwsproxy.a" \
            2>&1 | tee build/logs/xcodebuild.log

      - name: Verify app
        shell: bash
        run: |
          set -euo pipefail
          APP="build/TgWsProxy.xcarchive/Products/Applications/TgWsProxy.app"
          test -d "$APP"
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "MinimumOSVersion: $MIN_OS"
          test "$MIN_OS" = "15.0"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/TgWsProxy.xcarchive/Products/Applications/TgWsProxy.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../TgWsProxy.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-iOS15-IPA-${{ github.run_number }}
          path: build/TgWsProxy.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-iOS15-XCFramework-${{ github.run_number }}
          path: build/TgWsProxy.xcframework
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-iOS15-build-log-${{ github.run_number }}
          path: build/logs/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ios15-v1.0.0"
          TITLE="TG WS Proxy iOS 15 v1.0.0"
          NOTES="iOS 15 compatible build of TG WS Proxy.\n\nMinimum supported iOS: 15.0.\nArchitecture: arm64.\n\nIPA is unsigned and intended for sideloading (AltStore, Sideloadly, TrollStore where applicable)."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/TgWsProxy.ipa --clobber
          else
            gh release create "$TAG" build/TgWsProxy.ipa \
              --target ios15 \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
